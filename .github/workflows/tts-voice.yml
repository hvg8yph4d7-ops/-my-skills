name: TTS voice

on:
  push:
    branches: [claude/woodnext-open-day]
    paths: ["tts/jobs/**", "tts/make_voice.py", ".github/workflows/tts-voice.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: tts-voice

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q edge-tts
      - run: python tts/make_voice.py
      - name: Commit voice
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tts/out
          git commit -m "Озвучка готова (GitHub Actions)" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
