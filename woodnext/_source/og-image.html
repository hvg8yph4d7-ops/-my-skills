<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Montserrat:wght@700;800;900&display=block">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:#121418;color:#fff;font-family:Montserrat,sans-serif}
  .bg{position:absolute;inset:0;background:url(../images/house-1.jpg) 70% 60%/cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,20,24,.96) 0%,rgba(18,20,24,.86) 45%,rgba(18,20,24,.25) 78%,rgba(18,20,24,.1) 100%)}
  .in{position:absolute;left:72px;top:64px;right:72px;bottom:64px}
  .logo{font:800 34px/1 Montserrat;letter-spacing:.14em;padding-top:12px;display:inline-block}
  .x{position:relative;display:inline-block}
  .x svg{position:absolute;left:50%;top:-14px;width:36px;height:15px;transform:translateX(-56%)}
  .badge{margin-top:44px;display:inline-flex;align-items:center;gap:12px;padding:12px 20px;border-radius:99px;border:2px solid rgba(217,160,102,.45);background:rgba(184,116,58,.14);color:#D9A066;font:800 20px/1 Montserrat;letter-spacing:.08em;text-transform:uppercase}
  .badge i{width:10px;height:10px;border-radius:50%;background:#D9A066}
  h1{margin:30px 0 0;font:900 68px/1.02 Montserrat;text-transform:uppercase;letter-spacing:-.01em;max-width:800px}
  h1 span{background:linear-gradient(90deg,#D9A066,#B8743A);-webkit-background-clip:text;color:transparent}
  .meta{position:absolute;left:0;bottom:0;display:flex;gap:14px}
  .pill{padding:16px 22px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font:800 26px/1 Montserrat}
  .pill.g{background:#5E8C3A;border-color:#5E8C3A}
  .prize{position:absolute;right:0;top:0;width:330px;padding:24px 26px;border-radius:22px;background:linear-gradient(135deg,#D9A066,#B8743A 55%,#8E5427)}
  .prize small{display:block;font:800 15px/1 Montserrat;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
  .prize b{display:block;margin-top:12px;font:900 58px/1 Montserrat}
  .prize span{display:block;margin-top:8px;font:700 17px/1.3 Montserrat;text-transform:uppercase}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="in">
  <img src="../images/logo.png" alt="WOODNEXT" style="height:44px;display:block">
  <div class="badge"><i></i>2 года Каменскому филиалу</div>
  <h1>День открытых дверей <span>WOODNEXT</span></h1>
  <div class="prize"><small>Розыгрыш</small><b>50 000 ₽</b><span>сертификат</span></div>
  <div class="meta"><div class="pill g">8 ноября · 12:00</div><div class="pill">Каменск-Уральский</div></div>
</div>
</body></html>
